# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Architects of Balance
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: en-US
  baseUrl: glizzyguard.github.io/Tomb-of-Annihilation
  ignorePatterns:
    - private
    - templates
    - .obsidian
    - "**/*.json"   # ToA: FVTT actor exports
    - "**/*.css"    # ToA: print stylesheet
    - "**/*.html"   # ToA: the World Bible HTML export is GM-only
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Cinzel          # ToA: also used for the generated link-preview images
      body: EB Garamond
      code: IBM Plex Mono
    colors:                    # ToA 2026-10-04: parchment palette (Patrick's call), dark red accents
      lightMode:
        light: "#f3ead3"       # page: parchment
        lightgray: "#dfd1ae"   # borders, infobox header
        gray: "#a39472"        # muted text
        darkgray: "#3b3024"    # body text
        dark: "#231a10"        # headings
        secondary: "#7a1f1f"   # links, site title: dark red
        tertiary: "#a8581f"    # hover
        highlight: rgba(122, 31, 31, 0.08)
        textHighlight: "#e8c96a88"
      darkMode:
        light: "#1b1712"       # page: warm near-black
        lightgray: "#3a3126"
        gray: "#84765f"
        darkgray: "#ddd2ba"
        dark: "#f1e7d0"
        secondary: "#d9a05b"   # links: aged gold (dark red does not read on a dark page)
        tertiary: "#c8733f"
        highlight: rgba(217, 160, 91, 0.10)
        textHighlight: "#b3900288"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: published
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: ./plugins/toa-wiki
    enabled: true
    order: 25
    options:
      infobox: true
      dropSections: ["Encounter Prep", "Open Questions", "To-Do"]
      dropCodeLangs: ["dataview", "dataviewjs"]
      ledgerAsides: callout
      calloutTitle: Behind the screen
      companionRemap: true
      dateFromFrontmatterOnly: true
      portraits: true
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
      disableBrokenWikilinks: true
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      header: Cinzel          # ToA: overrides the ITS theme fonts; fontOrigin googleFonts because "local" loads nothing
      body: EB Garamond
      fontOrigin: googleFonts
  - source: "@quartz-themes/core"
    enabled: false   # ToA 2026-10-04: plain Quartz look, Patrick disliked the ITS theme colors
    options:
      theme: its-theme
      variation: ttrpg-dnd
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: true
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: false
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: true   # ToA: on trial; Patrick judges it against the ITS layout and the right-floating infobox
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: false
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: false
    options:
      links: {}
    layout:
      position: footer
      priority: 50
  - source: ./plugins/toa-footer
    enabled: true
    options:
      links: {}   # ToA: Patrick decides the footer links; a Discord invite on a public site lets anyone join
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: true
    options:
      limit: 5
      showTags: false
      hideFolderPages: true
      hideTagPages: true
    layout:
      position: right
      priority: 40
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true   # ToA 2026-10-04: the infobox already shows what matters; the panel sat above every article
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: ./plugins/toa-atlas   # ToA: timeline and atlas bases view (see SITE-NOTES)
    enabled: true
    options: {}
  - source: github:Requiae/quartz-leaflet-bases-plugin
    enabled: true
    options:
      enableCopyTool: false
  - source: "@quartz-community/obsidian-plugin-excalidraw"
    enabled: true   # ToA: no drawings in the vault yet; Syncer's Excalidraw integration must also be switched on
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
